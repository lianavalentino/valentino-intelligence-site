<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380" role="img" aria-labelledby="title desc">
  <title id="title">Client portal wireframe board</title>
  <desc id="desc">Nine low-fidelity wireframes for the Valentino Intelligence client portal.</desc>
  <style>
    .bg{fill:#f8f7f4}.panel{fill:#fff;stroke:#1f2937;stroke-width:2}.soft{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:2}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5}.accent{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.good{fill:#dcfce7;stroke:#15803d;stroke-width:1.5}.warn{fill:#fef3c7;stroke:#b45309;stroke-width:1.5}.ink{fill:#172033}.muted{fill:#64748b}.label{font:600 15px Arial,sans-serif;fill:#172033}.small{font:12px Arial,sans-serif;fill:#475569}.tiny{font:10px Arial,sans-serif;fill:#64748b}.heading{font:700 27px Arial,sans-serif;fill:#172033}.screen{font:700 19px Arial,sans-serif;fill:#172033}.screenNo{font:700 12px Arial,sans-serif;fill:#64748b}.nav{font:11px Arial,sans-serif;fill:#475569}
  </style>
  <rect class="bg" width="1800" height="1380"/>
  <text x="70" y="70" class="heading">Valentino Intelligence — client portal wireframes</text>
  <text x="70" y="100" class="small">Low-fidelity review board • derived from the static CleanMark Labels prototype • sample data only</text>

  <!-- shared panel treatment -->
  <g transform="translate(70 150)">
    <rect class="panel" width="500" height="350" rx="12"/>
    <text x="24" y="34" class="screenNo">01</text><text x="55" y="34" class="screen">Portal sign-in</text>
    <rect x="30" y="58" width="440" height="34" class="soft" rx="4"/><text x="44" y="79" class="tiny">CleanMark Labels  ·  Liana Valentino</text>
    <rect x="125" y="120" width="250" height="190" class="soft" rx="7"/>
    <text x="150" y="150" class="label">Client portal</text><text x="150" y="173" class="tiny">Sign in to your engagement</text>
    <text x="150" y="201" class="tiny">EMAIL</text><rect x="150" y="208" width="200" height="24" class="panel" rx="3"/>
    <text x="150" y="252" class="tiny">PASSWORD</text><rect x="150" y="259" width="200" height="24" class="panel" rx="3"/>
    <rect x="150" y="292" width="95" height="18" class="accent" rx="3"/><text x="158" y="305" class="tiny">DEMO CLIENT →</text>
  </g>

  <g transform="translate(650 150)">
    <rect class="panel" width="500" height="350" rx="12"/>
    <text x="24" y="34" class="screenNo">02</text><text x="55" y="34" class="screen">Overview</text>
    <rect x="20" y="55" width="95" height="275" class="soft" rx="5"/><text x="34" y="80" class="tiny">OVERVIEW</text><text x="34" y="104" class="tiny">INTAKE</text><text x="34" y="128" class="tiny">FILES</text><text x="34" y="152" class="tiny">PROGRESS</text><text x="34" y="176" class="tiny">STATUS</text><text x="34" y="200" class="tiny">DECISIONS</text><text x="34" y="224" class="tiny">DOCUMENTS</text><text x="34" y="248" class="tiny">BILLING</text>
    <rect x="135" y="55" width="345" height="95" class="soft" rx="6"/><text x="151" y="80" class="tiny">ENGAGEMENT SUMMARY</text><text x="151" y="105" class="label">Discovery Sprint · Week 1 of 2</text><text x="151" y="130" class="tiny">Next milestone</text><rect x="285" y="118" width="110" height="9" class="line"/><rect x="285" y="118" width="35" height="9" class="accent"/>
    <text x="135" y="178" class="tiny">NEEDS YOUR ACTION</text><rect x="135" y="188" width="345" height="33" class="panel" rx="4"/><rect x="135" y="229" width="345" height="33" class="panel" rx="4"/><rect x="135" y="270" width="345" height="33" class="panel" rx="4"/>
    <text x="149" y="209" class="tiny">Grant ERP access</text><text x="149" y="250" class="tiny">Review &amp; sign SOW</text><text x="149" y="291" class="tiny">Confirm interview times</text>
  </g>

  <g transform="translate(1230 150)">
    <rect class="panel" width="500" height="350" rx="12"/>
    <text x="24" y="34" class="screenNo">03</text><text x="55" y="34" class="screen">Intake questionnaire</text>
    <text x="25" y="70" class="tiny">PRE-CALL INTAKE · PRE-FILLED RESPONSES</text>
    <rect x="24" y="86" width="452" height="104" class="soft" rx="6"/><text x="40" y="110" class="label">Company</text><text x="40" y="135" class="tiny">Company name</text><rect x="40" y="142" width="175" height="24" class="panel" rx="3"/><text x="250" y="135" class="tiny">Your name and title</text><rect x="250" y="142" width="185" height="24" class="panel" rx="3"/>
    <rect x="24" y="202" width="452" height="104" class="soft" rx="6"/><text x="40" y="226" class="label">Systems &amp; tools</text><rect x="40" y="242" width="175" height="40" class="panel" rx="3"/><rect x="250" y="242" width="185" height="40" class="panel" rx="3"/>
    <rect x="24" y="318" width="105" height="18" class="accent" rx="3"/><text x="40" y="331" class="tiny">READ-ONLY FORM</text>
  </g>

  <g transform="translate(70 560)">
    <rect class="panel" width="500" height="350" rx="12"/>
    <text x="24" y="34" class="screenNo">04</text><text x="55" y="34" class="screen">Files</text>
    <rect x="25" y="58" width="450" height="95" class="dash" rx="7"/><text x="180" y="96" class="label">Drop files here to upload</text><text x="190" y="120" class="tiny">or browse files</text>
    <rect x="25" y="180" width="450" height="130" class="soft" rx="6"/><text x="42" y="204" class="tiny">NAME</text><text x="220" y="204" class="tiny">TYPE</text><text x="308" y="204" class="tiny">DATE</text><text x="400" y="204" class="tiny">STATUS</text>
    <path d="M25 216H475M25 247H475M25 278H475" class="line"/><text x="42" y="237" class="tiny">ERP export.csv</text><text x="400" y="237" class="tiny">REVIEWED</text><text x="42" y="268" class="tiny">Process map.pdf</text><text x="400" y="268" class="tiny">RECEIVED</text><text x="42" y="299" class="tiny">Weekly sales.xlsx</text><text x="400" y="299" class="tiny">REVIEWED</text>
  </g>

  <g transform="translate(650 560)">
    <rect class="panel" width="500" height="350" rx="12"/>
    <text x="24" y="34" class="screenNo">05</text><text x="55" y="34" class="screen">Progress</text>
    <text x="25" y="70" class="tiny">MILESTONES</text><rect x="25" y="82" width="450" height="28" class="soft" rx="4"/><circle cx="43" cy="96" r="7" fill="#15803d"/><text x="58" y="100" class="tiny">Kickoff complete</text><rect x="25" y="117" width="450" height="28" class="soft" rx="4"/><circle cx="43" cy="131" r="7" fill="#b45309"/><text x="58" y="135" class="tiny">Data readiness assessment</text>
    <text x="25" y="178" class="tiny">WORKING BOARD</text><rect x="25" y="190" width="100" height="120" class="soft" rx="4"/><rect x="140" y="190" width="100" height="120" class="soft" rx="4"/><rect x="255" y="190" width="100" height="120" class="soft" rx="4"/><rect x="370" y="190" width="105" height="120" class="soft" rx="4"/>
    <text x="36" y="211" class="tiny">TO DO</text><text x="151" y="211" class="tiny">IN PROGRESS</text><text x="266" y="211" class="tiny">WAITING</text><text x="381" y="211" class="tiny">DONE</text>
    <rect x="35" y="225" width="78" height="27" class="panel" rx="3"/><rect x="150" y="225" width="78" height="27" class="accent" rx="3"/><rect x="265" y="225" width="78" height="27" class="warn" rx="3"/><rect x="380" y="225" width="82" height="27" class="good" rx="3"/>
  </g>

  <g transform="translate(1230 560)">
    <rect class="panel" width="500" height="350" rx="12"/>
    <text x="24" y="34" class="screenNo">06</text><text x="55" y="34" class="screen">Status report</text>
    <rect x="25" y="58" width="450" height="250" class="soft" rx="6"/><text x="42" y="84" class="label">Week 1</text><circle cx="420" cy="79" r="8" fill="#15803d"/><text x="435" y="83" class="tiny">ON TRACK</text>
    <text x="42" y="115" class="tiny">DONE THIS WEEK</text><path d="M42 124H225M42 137H205" class="line"/><text x="270" y="115" class="tiny">NEXT WEEK</text><path d="M270 124H450M270 137H425" class="line"/>
    <text x="42" y="175" class="tiny">BLOCKERS / NEEDS FROM YOU</text><rect x="42" y="185" width="405" height="35" class="panel" rx="3"/><text x="54" y="207" class="tiny">ERP access · owner: operations lead · needed Sep 15</text>
    <text x="42" y="248" class="tiny">HOURS USED VS. PLAN</text><rect x="42" y="258" width="260" height="10" class="line"/><rect x="42" y="258" width="72" height="10" class="accent"/>
  </g>

  <g transform="translate(70 970)">
    <rect class="panel" width="500" height="350" rx="12"/>
    <text x="24" y="34" class="screenNo">07</text><text x="55" y="34" class="screen">Decision log</text>
    <rect x="25" y="60" width="450" height="230" class="soft" rx="6"/><text x="42" y="85" class="tiny">DATE</text><text x="110" y="85" class="tiny">DECISION</text><text x="245" y="85" class="tiny">OPTIONS</text><text x="375" y="85" class="tiny">STATUS</text>
    <path d="M25 97H475M25 145H475M25 193H475M25 241H475" class="line"/><text x="42" y="123" class="tiny">Sep 10</text><text x="110" y="123" class="tiny">Confirm ERP scope</text><rect x="375" y="108" width="62" height="19" class="good" rx="8"/><text x="387" y="122" class="tiny">DECIDED</text>
    <text x="42" y="171" class="tiny">Sep 12</text><text x="110" y="171" class="tiny">Pick reporting tool</text><rect x="375" y="156" width="48" height="19" class="warn" rx="8"/><text x="387" y="170" class="tiny">OPEN</text>
  </g>

  <g transform="translate(650 970)">
    <rect class="panel" width="500" height="350" rx="12"/>
    <text x="24" y="34" class="screenNo">08</text><text x="55" y="34" class="screen">Documents</text>
    <rect x="25" y="60" width="450" height="230" class="soft" rx="6"/><text x="42" y="85" class="tiny">DOCUMENT</text><text x="320" y="85" class="tiny">STATUS</text><text x="415" y="85" class="tiny">ACTION</text>
    <path d="M25 97H475M25 140H475M25 183H475M25 226H475" class="line"/><text x="42" y="123" class="tiny">Mutual NDA</text><rect x="320" y="108" width="55" height="19" class="good" rx="8"/><text x="329" y="122" class="tiny">SIGNED</text><rect x="412" y="108" width="42" height="19" class="panel" rx="3"/><text x="420" y="122" class="tiny">VIEW</text>
    <text x="42" y="166" class="tiny">Discovery Sprint SOW</text><rect x="320" y="151" width="55" height="19" class="warn" rx="8"/><text x="329" y="165" class="tiny">PENDING</text><rect x="412" y="151" width="42" height="19" class="panel" rx="3"/><text x="420" y="165" class="tiny">VIEW</text>
    <text x="42" y="209" class="tiny">Change request</text><rect x="320" y="194" width="42" height="19" class="soft" rx="8"/><text x="332" y="208" class="tiny">NONE</text>
  </g>

  <g transform="translate(1230 970)">
    <rect class="panel" width="500" height="350" rx="12"/>
    <text x="24" y="34" class="screenNo">09</text><text x="55" y="34" class="screen">Billing</text>
    <text x="25" y="70" class="label">Discovery Sprint total: $5,000</text>
    <rect x="25" y="88" width="450" height="150" class="soft" rx="6"/><text x="42" y="112" class="tiny">INVOICE</text><text x="140" y="112" class="tiny">DESCRIPTION</text><text x="300" y="112" class="tiny">AMOUNT</text><text x="390" y="112" class="tiny">STATUS</text>
    <path d="M25 124H475M25 165H475M25 206H475" class="line"/><text x="42" y="150" class="tiny">INV-01</text><text x="140" y="150" class="tiny">Deposit</text><text x="300" y="150" class="tiny">$2,500</text><rect x="390" y="135" width="44" height="18" class="good" rx="8"/><text x="400" y="148" class="tiny">PAID</text>
    <text x="42" y="191" class="tiny">INV-02</text><text x="140" y="191" class="tiny">Balance</text><text x="300" y="191" class="tiny">$2,500</text><rect x="390" y="176" width="52" height="18" class="warn" rx="8"/><text x="400" y="189" class="tiny">PENDING</text>
    <rect x="25" y="260" width="450" height="48" class="soft" rx="5"/><text x="42" y="282" class="tiny">Payment method: card on file</text><text x="42" y="298" class="tiny">Automatic charge on invoice due date</text>
  </g>
</svg>
